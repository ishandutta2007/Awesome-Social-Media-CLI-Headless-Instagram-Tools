<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="insta-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f58529"/>
      <stop offset="30%" stop-color="#dd2a7b"/>
      <stop offset="70%" stop-color="#8134af"/>
      <stop offset="100%" stop-color="#515bd4"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="#1f293d" stroke-width="0.8" opacity="0.35">
    <line x1="0" y1="45" x2="1200" y2="45" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Animated Background Elements (Non-obtrusive Background Glows & Pulses) -->
  <g opacity="0.45">
    <!-- Floating Cyber Dots -->
    <circle cx="180" cy="80" r="4" fill="#00f2fe">
      <animate attributeName="cy" values="75;85;75" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="110" r="5" fill="#f58529">
      <animate attributeName="cy" values="115;105;115" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="280" r="3.5" fill="#8134af">
      <animate attributeName="cy" values="275;285;275" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="270" r="4.5" fill="#10b981">
      <animate attributeName="cy" values="275;265;275" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Decorative Animated Flow Waves in Far Background -->
  <path d="M-100,320 Q300,280 600,310 T1300,290" fill="none" stroke="url(#insta-accent)" stroke-width="2" opacity="0.3">
    <animate attributeName="d" values="M-100,320 Q300,280 600,310 T1300,290;M-100,310 Q300,330 600,295 T1300,315;M-100,320 Q300,280 600,310 T1300,290" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M-100,335 Q300,305 600,325 T1300,305" fill="none" stroke="url(#cyan-glow)" stroke-width="1.5" opacity="0.2">
    <animate attributeName="d" values="M-100,335 Q300,305 600,325 T1300,305;M-100,325 Q300,345 600,310 T1300,330;M-100,335 Q300,305 600,325 T1300,305" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- Animated Command Prompt Indicator -->
  <g transform="translate(100, 52)">
    <rect width="180" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#ef4444"/>
    <circle cx="32" cy="14" r="5" fill="#f59e0b"/>
    <circle cx="48" cy="14" r="5" fill="#10b981"/>
    <text x="64" y="19" font-size="12" fill="#94a3b8" font-family="monospace" font-weight="600">terminal://cli</text>
  </g>

  <!-- Status / Mode Pill Right -->
  <g transform="translate(930, 52)">
    <rect width="170" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="14" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="18.5" font-size="11.5" fill="#e2e8f0" font-family="monospace" font-weight="600">HEADLESS ACTIVE</text>
  </g>

  <!-- FOREGROUND: Main Title and Headers (Never obscured) -->
  <g id="foreground-content">
    <!-- Main Headline with Gradient -->
    <text x="600" y="145" text-anchor="middle" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Social Media CLI &amp;
    </text>
    <text x="600" y="190" text-anchor="middle" font-size="34" font-weight="800" fill="url(#insta-accent)" letter-spacing="-0.5" filter="url(#glow)">
      Headless Instagram Tools
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="600" y="235" text-anchor="middle" font-size="16" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Curated CLI Schedulers • Terminal TUIs • Headless Bot Automation • Feed Scrapers &amp; Schedulers
    </text>

    <!-- Interactive Badges row inside banner -->
    <g transform="translate(600, 275)">
      <!-- Pill 1: Terminal First -->
      <g transform="translate(-240, 0)">
        <rect x="0" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="65" y="17" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8" font-family="monospace">&gt;_ CLI &amp; TUI</text>
      </g>
      <!-- Pill 2: Headless API -->
      <g transform="translate(-90, 0)">
        <rect x="0" y="0" width="170" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="85" y="17" text-anchor="middle" font-size="11" font-weight="600" fill="#ec4899" font-family="monospace">&#x2699; Headless Automation</text>
      </g>
      <!-- Pill 3: Self-Hosted -->
      <g transform="translate(100, 0)">
        <rect x="0" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="70" y="17" text-anchor="middle" font-size="11" font-weight="600" fill="#34d399" font-family="monospace">&#x1f680; Self-Hosted SaaS</text>
      </g>
    </g>
  </g>
</svg>
